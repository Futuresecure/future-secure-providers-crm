<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSP Broadcast — Preview</title><style>body{font:16px system-ui;background:#f4f7fb;color:#16314b;margin:0}main{max-width:850px;margin:40px auto;padding:25px;background:white;border-radius:16px}label{display:block;margin:16px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac7d4;border-radius:8px}button{padding:12px 18px;background:#16456d;color:white;border:0;border-radius:8px;margin-top:20px}small{color:#586d80}</style></head><body><main><h1>WhatsApp Broadcast</h1><p>Development preview · Sending disabled</p><label>Campaign Name</label><input id="title" placeholder="Campaign name"><label>Approved Template Name</label><input id="template" placeholder="Meta-approved template"><label>Language</label><select id="lang"><option>en</option><option>ta</option></select><label>Opted-in phone numbers (one per line)</label><textarea id="phones" rows="7" placeholder="919585905905"></textarea><label>Schedule (optional)</label><input type="datetime-local" id="schedule"><button onclick="preview()">Validate & Preview</button><pre id="result" aria-live="polite"></pre><small>No messages are sent from this page. Only numbers with recorded marketing opt-in may be enrolled.</small></main><script>function preview(){const raw=document.getElementById('phones').value.split(/\n/).map(s=>s.replace(/\D/g,''));const phones=[...new Set(raw.filter(Boolean).map(s=>s.length===10?'91'+s:s))];const invalid=phones.filter(s=>!/^91[6-9]\d{9}$/.test(s));document.getElementById('result').textContent=JSON.stringify({campaign:document.getElementById('title').value,template:document.getElementById('template').value,language:document.getElementById('lang').value,uniqueRecipients:phones.length,invalidNumbers:invalid,schedule:document.getElementById('schedule').value||null,sending:'DISABLED'},null,2)}</script></body></html>
